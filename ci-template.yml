# =====================================================================
# GitHub Actions CI Workflow Template for SparrowBase
# Copy this file to .github/workflows/ci.yml in your GitHub repository
# =====================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Typecheck Packages
        run: npm run build

      - name: Run Test Suites (Workers, Client & React)
        run: npm run test
